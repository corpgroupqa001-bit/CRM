
# On changes to Supabase files on main, apply migrations and deploy the webhook.
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::SUPABASE_DB_PASSWORD is missing"
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::SUPABASE_PROJECT_REF is missing"
            exit 1
          }

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # 0001–0025 were applied by hand in the SQL Editor before this workflow existed, so the project's
      # migration history didn't list them and db push tried to run 0001 again ("relation already exists").
      # Marking them applied only writes to the history table; it's a no-op once they're recorded.
      - name: Record migrations applied by hand
        run: >
          supabase migration repair --linked --status applied
          20261022000001 20261022000002 20261022000003 20261022000004 20261022000005
          20261022000006 20261022000007 20261022000008 20261022000009 20261023000010
          20261023000011 20261023000012 20261023000013 20261023000014 20261023000015
          20261023000016 20261023000017 20261023000018 20261023000019 20261023000020
          20261023000021 20261024000022 20261024000023 20261024000024 20261024000025

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Deploy attendance device webhook
        run: supabase functions deploy punch-webhook --no-verify-jwt
